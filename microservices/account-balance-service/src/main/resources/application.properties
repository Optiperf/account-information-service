#spring.datasource.username=sa
#spring.datasource.password=
#spring.h2.console.enabled=true
#spring.h2.console.path=/h2-console


# PostgreSQL Database Configuration
# These can be overridden by environment variables from docker-compose.yml
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/accountdb_dev}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:devuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:devpass}
spring.datasource.driverClassName=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
 # 'create-drop' for dev/test, 'update', 'validate', or 'none' for prod
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
 # Often needed for PostgreSQL with Byte Arrays/LOBs
# JPA Properties
#spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
 # Creates/updates schema on startup. Use 'create-drop' for tests, 'validate' or 'none' in production.
#spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
 # Shows SQL queries in the logs, useful for debugging
spring.jpa.show-sql=false
 # Formats the SQL shown in logs
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.deserialization.fail-on-unknown-properties=true

management.endpoint.health.show-details=ALWAYS
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.health.enabled=true
management.server.ssl.enabled=false