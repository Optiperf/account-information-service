plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.4' // Changed to a stable version
	id 'io.spring.dependency-management' version '1.1.7' // Aligned with Spring Boot 3.2.x
}

group = 'nl.optiperf.microservices.core.account'
version = '1.0.0-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

jar {
    enabled = false
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.postgresql:postgresql'
	// For H2 in-memory database
	//runtimeOnly 'com.h2database:h2'
	// For PostgreSQL (you can uncomment this later when you switch)
	// runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
			
tasks.named('test') {
	useJUnitPlatform()
}
