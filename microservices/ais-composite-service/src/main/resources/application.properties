spring.application.name=ais-composite-service
server.port=8088
management.server.port=8089
logging.level.root=INFO
logging.level.nl.optiperf=INFO
# Make sure 'health' is included. To expose all endpoints, you can use '*'
# For production, it's recommended to only expose what you need, e.g., "health,info"
management.endpoint.health.show-details=ALWAYS
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=*
management.endpoint.health.enabled=true
management.server.ssl.enabled=false