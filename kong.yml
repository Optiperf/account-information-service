_format_version: "3.0"
services:
  - name: account-details-service
    url: http://account-details-service:8082
    #tls_verify: false  # Disable SSL verification for self-signed certs
    routes:
      - name: details
        hosts:
          - localhost
        paths:
          - ~/account-details(|/.*)
        strip_path: false
        protocols:
          - http
        methods:
          - GET
          - POST
          - PUT
          - DELETE

  - name: account-address-service
    url: http://account-address-service:8084
    #tls_verify: false  # Disable SSL verification for self-signed certs
    routes:
      - name: address
        hosts:
          - localhost
        paths:
          - ~/account-address(|/.*)
        strip_path: false
        protocols:
          - http
        methods:
          - GET
          - POST
          - PUT
          - DELETE

  - name: account-balance-service
    url: http://account-balance-service:8086
    #tls_verify: false  # Disable SSL verification for self-signed certs
    routes:
      - name: balance
        hosts:
          - localhost
        paths:
          - ~/account-balance(|/.*)
        strip_path: false
        protocols:
          - http
        methods:
          - GET
          - POST
          - PUT
          - DELETE

  - name: ais-composite-service
